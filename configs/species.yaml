# ============================================================================
# ChampiQuest — Espèces étudiées & paramètres d'acquisition
# ============================================================================
# Source de vérité lue par les scripts d'ingestion (src/champiquest/data/).
# Chaque section est commentée pour expliquer à quoi sert chaque valeur.
# ----------------------------------------------------------------------------

# ---- Zone géographique : Vosges + Forêt-Noire (étendues) -------------------
# Rectangle englobant (bounding box) en degrés décimaux.
# Élargie pour couvrir les Vosges de l'ouest (plus océaniques) et la Forêt-Noire
# de l'est (plus continentale), afin d'augmenter le volume d'observations.
# min_* / max_* : bornes inférieures et supérieures de la zone.
bbox:
  min_lat: 47.3
  max_lat: 49.3
  min_lon: 6.4
  max_lon: 8.7

# ---- Plage d'années d'observation ------------------------------------------
# start : on commence en 1950 car c'est la limite de fiabilité des
#         réanalyses météo ERA5 (source Open-Meteo).
# end   : null = "jusqu'à aujourd'hui" (le script remplace null par
#         l'année courante). Pas de borne haute : l'EDA affinera.
year_range:
  start: 1950
  end: null

# ---- Espèces étudiées ------------------------------------------------------
# Liste des espèces à récupérer. Pour chaque espèce :
#   - key        : identifiant interne (slug) utilisé pour les noms de
#                  fichiers CSV et, plus tard, l'API.
#   - scientific : nom scientifique de référence (tel que renvoyé par GBIF).
#   - gbif_key   : taxonKey GBIF courant (usageKey), obtenu via
#                  https://api.gbif.org/v1/species/match?name=... .
#   - season     : saison de fructification (indicatif, pour l'EDA ;
#                  les fenêtres exactes seront calculées depuis les données).
#   - habitat    : milieu de croissance (indicatif, pour l'EDA et la
#                  vérification des pseudo-absences).
species:
  - key: "boletus_edulis"
    scientific: "Boletus edulis"
    gbif_key: 5954958
    season: "automne"
    habitat: "forêt"

  - key: "boletus_aereus"
