[project]
name = "champiquest"
version = "0.1.0"
description = "Prédiction de pousse de champignons en Alsace (météo → fructification) et reconnaissance d'espèce par image."
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "champiquest", from = "src" }]

[tool.poetry.dependencies]
# runtime (image Docker / API) — le reste est dans [dependency-groups]
pandas = "<3.0"
numpy = "<2.6"
# importés directement par le code runtime (pas seulement transitifs)
scipy = "^1.18.1"
scikit-learn = "^1.9.1"
joblib = "^1.6.0"
pillow = "^12.3.0"
matplotlib = "<3.12"
openmeteo-requests = "^1.7.5"
requests-cache = "^1.3.3"
retry-requests = "^2.0.0"
pyyaml = "^6.0.3"
lightgbm = "^4.7.0"
torch = "2.11.0"
torchvision = "0.26.0"
timm = "^1.0.30"
fastapi = "^0.161.1"
uvicorn = "^0.54.0"
python-multipart = "^0.0.32"
pyarrow = "<26"

[dependency-groups]
# entraînement / EDA / ingestion (pas embarqués dans l'image Docker)
train = [
    "jupyter (>=1.1.1,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "folium (>=0.20.0,<0.21.0)",
    "pygbif (>=0.7.0,<0.8.0)",
    "tqdm (>=4.70.1,<5.0.0)",
    "geopandas (>=1.2.0,<2.0.0)",
    "shapely (>=2.2.0,<3.0.0)",
    "rasterio (>=1.5.2,<2.0.0)",
    "rioxarray (>=0.23.0,<0.24.0)",
    "fg-data-profiling (>=4.20.0,<5.0.0)",
    "mlflow (>=3.17.1,<4.0.0)",
    "shap (>=0.53.0,<0.54.0)",
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
