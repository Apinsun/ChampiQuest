name: CD

# CD = build de l'image Docker + push vers GHCR. Uniquement sur `main` et les
# tags `v*`, ET seulement si un fichier qui affecte l'image change (paths).
# → un commit sur deploy.sh / docs / tests ne rebuild PAS l'image.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'Dockerfile'
      - '.dockerignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository (GHCR exige des noms en minuscules)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest
          # cache de layers GitHub Actions : les couches inchangées sont réutilisées
          # → même empreinte → `docker pull` ne télécharge que ce qui a changé.
          cache-from: type=gha
          cache-to: type=gha,mode=max
