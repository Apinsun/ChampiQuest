name: CI

# CI = tests. Déclenchée sur CHAQUE push et CHAQUE PR, sur toutes les branches :
# on veut le feedback le plus tôt possible, où qu'on développe.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # deps runtime (main) + outils de test (test) — pas le groupe train (ni GDAL)
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --only main,test --no-interaction

      - name: Run tests
        run: poetry run pytest -q
