name: CI

# CI = tests. Déclenchée sur CHAQUE push et CHAQUE PR, sur toutes les branches :
# on veut le feedback le plus tôt possible, où qu'on développe.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # deps runtime (mêmes que l'image Docker) + outils de test
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -q
